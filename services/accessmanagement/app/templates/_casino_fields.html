{# Shared fields of a casino declaration (CHANGE 012). #}
<select name="kind" class="reason-in" aria-label="what">
  <option value="visit">Visit</option>
  <option value="annual_levy">Bought annual levy pass</option>
</select>
<input type="date" name="visit_date" required class="reason-in" aria-label="date">
<select name="casino" required class="reason-in" aria-label="casino">
  <option value="Marina Bay Sands">Marina Bay Sands</option>
  <option value="Resorts World Sentosa">Resorts World Sentosa</option>
</select>
<label class="small"><input type="checkbox" name="official_duty"> official duty</label>
<input type="text" name="purpose" placeholder="official purpose (if official)" class="reason-in">
