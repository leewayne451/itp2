<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ service_name }} — Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <div class="logo">{{ service_name }}</div>
    <p class="subtitle">Please sign in to continue</p>
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label>Username <input name="username" required autofocus autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">Try <code>alice</code>/<code>alice</code> or <code>bob</code>/<code>bob</code></p>
  </main>
</body>
</html>
