<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ service_name }} — Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <div class="logo">{{ service_name }}</div>
    <p class="subtitle">Sign in to continue</p>
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <a class="btn sso" href="{{ url_for('login') }}" data-testid="sso-signin">Sign in with ServiceJourney SSO</a>
    <p class="hint">One sign-in for every ServiceJourney app. If you are already signed in to the console,
      you will be let straight in.</p>
  </main>
</body>
</html>
